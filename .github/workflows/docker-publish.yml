name: Publish images

# Builds and publishes the production images to the GitHub Container
# Registry so the deployment server only has to pull them —
# docker-compose.coolify.yml references these images instead of building
# on the server.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # Inlined into the web client bundle at build time (NEXT_PUBLIC_*), so the
  # published web image is specific to this deployment's API domain.
  NEXT_PUBLIC_API_BASE_URL: https://api.cost-demo.sd-rp.de

jobs:
  publish:
    name: Build & push to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/api.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-api:latest
            ghcr.io/${{ github.repository }}-api:${{ github.sha }}
      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/web.Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ env.NEXT_PUBLIC_API_BASE_URL }}
          tags: |
            ghcr.io/${{ github.repository }}-web:latest
            ghcr.io/${{ github.repository }}-web:${{ github.sha }}
