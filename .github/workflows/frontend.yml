name: Frontend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-gate:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install workspaces
        run: npm ci
      - name: Regenerate types from the committed OpenAPI schema
        run: npm run generate-types --workspace=apps/web
      - name: Fail if the checked-in types are stale
        run: |
          git diff --exit-code packages/shared/src/types.ts || {
            echo "::error::packages/shared/src/types.ts is out of date." \
              "Run 'npm run generate-types' in apps/web and commit the result."
            exit 1
          }
      - name: ESLint
        run: npm run lint --workspace=apps/web
      - name: TypeScript (strict, no emit)
        run: npm run typecheck --workspace=apps/web
      - name: Next.js production build
        run: npm run build --workspace=apps/web
