[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gcol-api"
version = "0.1.0"
description = "FastAPI backend for the household finance and cost-of-living application."
requires-python = ">=3.12"
dependencies = [
    "gcol-analytics",
    "fastapi>=0.136",
    "uvicorn[standard]>=0.34",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "fastapi-users[sqlalchemy]>=15.0",
    "apscheduler>=3.10",
    "httpx>=0.27",
    "tenacity>=9.0",
    "structlog>=24.1",
    "python-multipart>=0.0.12",
    "typer>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
# Migration files follow Alembic's own generated template conventions
# (typing.Union, boilerplate revision variables) rather than this project's style.
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
